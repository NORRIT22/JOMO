<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0B0C">
<title>JOMO AI</title>
<style>
:root{--bg:#0B0B0C;--panel:#151517;--line:#26262a;--txt:#EAEAEA;--mut:#85858B;--acc:#5B4DFF;--el:#1f1f23;--el2:#1d1d20;--code:#0f0f18;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);color:var(--txt);font:14px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--mut);padding:6px 8px;border-radius:8px;transition:.2s}button:hover{color:var(--txt);background:var(--el2)}button:active{transform:scale(.96)}button:focus-visible,.field:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}@keyframes pulse{to{box-shadow:0 0 0 12px #5b4dff00}}@keyframes breathe{50%{transform:scale(1.07)}}@keyframes ring{to{opacity:0;transform:scale(1.5)}}@keyframes talk{50%{transform:scale(1.1)}}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 270px;height:100%;min-height:0}.app>*{animation:fade .35s both}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;min-height:0}aside.r{border-right:0;border-left:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;letter-spacing:.5px;padding:4px 4px 8px;color:var(--txt);font-weight:650}.brand svg{width:26px;height:26px}
.new{background:var(--el);border:1px solid var(--line);color:var(--txt);justify-content:flex-start;padding:9px 12px}.new:hover{border-color:var(--acc)}
.field{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:0}.field:focus{border-color:var(--acc);box-shadow:0 0 0 3px #5b4dff22}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}.it{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-radius:8px;color:var(--mut);cursor:pointer;gap:6px;min-height:36px}.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.it:hover,.it.on{background:var(--el);color:var(--txt)}.it button{padding:3px;opacity:0}.it:hover button{opacity:1}.it button:hover{color:#ff7a7a}
.me{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
main{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0}header{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);position:relative;z-index:2}header .tg{position:absolute;left:12px}select.field{width:auto;background:var(--panel)}
#msgs{flex:1;overflow:auto;padding:24px 16px;scroll-behavior:smooth}.w{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}.m{display:flex;gap:12px;animation:rise .25s both}.av{width:28px;height:28px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:none;color:#fff}.av.think{animation:pulse 1.2s ease-out infinite}.av.think svg{animation:spin 2s linear infinite}.av svg{width:16px;height:16px}
.m.u{justify-content:flex-end}.m.u .b{background:var(--el);border:1px solid var(--line);padding:9px 14px;border-radius:14px;max-width:85%}.b{min-width:0;overflow-wrap:anywhere}.b pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;margin:8px 0;direction:ltr;text-align:left}.b code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}.b :not(pre)>code{background:var(--el);padding:1px 5px;border-radius:5px}.b h3,.b h4{margin:12px 0 4px}.b h3{font-size:18px}.b h4{font-size:16px}.b ul,.b ol{padding-inline-start:22px;margin:6px 0}.b a{color:#9b91ff}.b blockquote{border-inline-start:3px solid var(--acc);padding-inline-start:10px;color:var(--mut);margin:6px 0}
.act{display:flex;gap:2px;margin-top:6px;opacity:.65}.act button{padding:4px 6px;font-size:12px}.err{color:#ff8585}.dots{display:inline-flex;gap:5px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:dots 1.1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.empty{margin:12vh auto 0;text-align:center;color:var(--mut)}.empty .lg{width:84px;height:84px;margin:0 auto 14px;display:grid;place-items:center}.empty svg{width:56px;height:56px;color:var(--txt)}.sgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:26px auto 0;max-width:520px}.sg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:start;color:var(--mut);justify-content:flex-start}.sg:hover{border-color:var(--acc)}
.comp{max-width:760px;width:calc(100% - 32px);margin:0 auto 16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px}.comp:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px #5b4dff1f}textarea{width:100%;background:none;border:0;outline:0;resize:none;max-height:180px;padding:4px}.bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.send{background:var(--acc);color:#fff;border-radius:50%;width:34px;height:34px;justify-content:center;padding:0;margin-left:auto}.send:hover{background:#6e62ff;color:#fff}
.chip{background:var(--el);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:6px}.chip button{padding:0 2px;font-size:12px}
.sec{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}.sec h4,.sec-toggle{font-weight:500;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px}.sec-toggle{width:100%;display:flex;justify-content:space-between;padding:0}.sec-toggle:after{content:"⌄";font-size:17px}.sec.collapsed .sec-toggle:after{transform:rotate(-90deg)}.sec.collapsed #info{display:none}#info{padding-top:2px;line-height:1.7}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(480px,92vw);margin:auto;position:fixed;inset:0;z-index:40}dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}dialog label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.pri{background:var(--acc);color:#fff}
:root[data-theme=light]{--bg:#f4f4f7;--panel:#fff;--line:#e3e3ea;--txt:#17171a;--mut:#6c6c76;--el:#eeeef3;--el2:#e8e8ef;--code:#f1f1f6}
.cb{margin:10px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;direction:ltr}.ch{display:flex;justify-content:space-between;align-items:center;background:var(--el);padding:4px 10px;font-size:12px;color:var(--mut)}.cb pre{margin:0!important;border:0!important;border-radius:0!important}.cc{padding:2px 8px;font-size:12px}
.gen{position:relative;width:min(420px,100%);aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}.gen img{width:100%;height:100%;object-fit:cover}.sk{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#5b4dff33 50%,transparent 70%) 0 0/200% 100%,var(--panel);animation:sh 1.5s linear infinite}@keyframes sh{to{background-position:200% 0}}.gen.ok .sk,.gen.bad .sk{display:none}.bd{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:20px;color:var(--mut)}.gen.bad .bd{display:grid}
#im.on{color:var(--acc);background:#5b4dff22}#sbt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);justify-content:center;padding:0;opacity:0;pointer-events:none;z-index:3}#sbt.show{opacity:1;pointer-events:auto}
body.drag:after{content:"Drop files to attach";position:fixed;inset:12px;z-index:30;display:grid;place-items:center;border:2px dashed var(--acc);border-radius:18px;background:#0b0b0ccc;color:white;font-size:18px;pointer-events:none}
#vm{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#1b1640f2,#0B0B0Cf7 70%);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;visibility:hidden;transition:.3s;color:#eaeaea}#vm.on{opacity:1;visibility:visible}#vo{width:160px;height:160px;border-radius:50%;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 30%,#a99fff,var(--acc) 45%,#2b2399);box-shadow:0 0 80px #5b4dff88,inset 0 0 40px #ffffff22}#vo:before,#vo:after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1.5px solid #5b4dff99;opacity:0}#vo[data-s=listen]{animation:breathe 2.4s ease-in-out infinite}#vo[data-s=listen]:before{animation:ring 2.4s ease-out infinite}#vo[data-s=think]{animation:spin 1.6s linear infinite}#vo[data-s=speak]{animation:talk .55s ease-in-out infinite}#vt{max-width:560px;text-align:center;padding:0 20px;font-size:17px;min-height:52px;color:#cfcfe6}.vb{display:flex;gap:14px}.vb button{background:#ffffff14;color:white;border-radius:50%;width:52px;height:52px;justify-content:center;padding:0}.vb button.off{background:#ff4d6d55}#vm select{background:#ffffff14;border:1px solid #ffffff22;color:white;border-radius:8px;padding:6px 10px}
@media(max-width:1000px){.app{grid-template-columns:250px minmax(0,1fr)}aside.r{display:none}}@media(max-width:700px){.app{grid-template-columns:1fr}#sb{position:fixed;inset:0 25% 0 0;z-index:10;transform:translateX(-105%);transition:transform .3s;box-shadow:none}#sb.open{transform:none;box-shadow:20px 0 60px #000a}.sgs{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

</defs></svg>
<div class="app">
<aside id="sb"><div class="brand"><svg class="i"><use href="#logo"/></svg>JOMO AI</div>
<button class="new" id="nw"><svg class="i"><use href="#plus"/></svg>New Conversation</button>
<input class="field" id="q" placeholder="Search conversations" aria-label="Search conversations"><div id="list"></div>
<div class="me"><button id="exp"><svg class="i"><use href="#dl"/></svg>Export chat</button><button id="th"><svg class="i"><use href="#sun"/></svg>Light / Dark</button><button id="st"><svg class="i"><use href="#gear"/></svg>Settings</button><div style="display:flex;gap:8px;align-items:center;padding:6px 8px;color:var(--mut)"><svg class="i"><use href="#user"/></svg>User Profile</div></div></aside>
<main><header><button class="tg" id="tg" title="Sidebar"><svg class="i"><use href="#panel"/></svg></button><select class="field" id="mode" aria-label="Response mode"><option value="fast">Fast Mode</option><option value="think">Thinking Mode</option></select><span class="chip" id="mn">auto</span></header>
<div id="msgs"><div class="w" id="w"></div></div><button id="sbt" title="Scroll to bottom"><svg class="i"><use href="#arr"/></svg></button>
<div class="comp"><textarea id="in" rows="1" placeholder="Ask JOMO anything..." dir="auto"></textarea><div class="bar"><button id="at"><svg class="i"><use href="#clip"/></svg>Attach File</button><button id="vc"><svg class="i"><use href="#mic"/></svg>Dictate</button><button id="lv" style="color:var(--acc)"><svg class="i"><use href="#wave"/></svg>Live Voice</button><button id="im"><svg class="i"><use href="#img"/></svg>Create Image</button><span id="fl" class="chip" style="display:none"></span><button class="send" id="sd" title="Send"><svg class="i"><use href="#send"/></svg></button></div><input type="file" id="fi" hidden multiple accept=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.log,.yml,.yaml"></div></main>
<aside class="r"><div class="sec" id="sessionSec"><button class="sec-toggle" id="sessionToggle" type="button" aria-expanded="true" aria-controls="info">Current Session</button><div id="info" style="color:var(--mut)"></div></div><div class="sec"><h4>System Prompt</h4><textarea class="field" id="sp" rows="6" dir="auto" style="resize:vertical"></textarea></div><div class="sec"><h4>Temperature <span id="tv" style="float:right;color:var(--txt)"></span></h4><input type="range" id="tp" min="0" max="1.5" step="0.1" style="accent-color:var(--acc)"></div></aside>
</div>
<div id="vm"><select id="vl"><option value="ar-SA">العربية</option><option value="fr-FR">Français</option><option value="en-US">English</option></select><div id="vo" data-s="idle"></div><div id="vt"></div><div class="vb"><button id="vmu" title="Mute"><svg class="i"><use href="#mic"/></svg></button><button id="vx" title="End"><svg class="i"><use href="#x"/></svg></button></div></div>
<dialog id="dg"><h3 style="font-weight:500">Model Settings</h3><p style="color:var(--mut);margin:8px 0 12px">Leave blank to let the Supabase function select its default model. Model IDs must be supported by your backend.</p><label for="m1">Fast model</label><input class="field" id="m1" dir="ltr" placeholder="auto (recommended)"><label for="m2">Thinking model</label><input class="field" id="m2" dir="ltr" placeholder="auto (recommended)"><div class="row"><button id="rst" style="margin-right:auto">Reset Defaults</button><button id="cl">Cancel</button><button class="pri" id="sv">Save</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const PRIMARY_ENDPOINT="https://ervctvcghmyurnqlyqwm.supabase.co/functions/v1/coarena-chat";
const PRIMARY_KEY="sb_publishable_FGJPNZUejNt9gC2h2si6-Q_NG06feiy";
const FALLBACK_ENDPOINT="https://text.pollinations.ai/openai";
const DEF={fast:"",think:"",sys:"You are JOMO, a precise, concise and helpful AI assistant. Answer in the language of the user.",temp:.7,mode:"fast",sessionCollapsed:false,theme:"dark",vl:"ar-SA"};
let S;try{S=JSON.parse(localStorage.getItem("jomo")||"null")}catch{S=null}
if(!S||typeof S!=="object")S={convs:[],cur:null,cfg:{}};
if(!Array.isArray(S.convs))S.convs=[];
S.cfg={...DEF,...(S.cfg||{})};
if(!["fast","think"].includes(S.cfg.mode))S.cfg.mode="fast";
if(!Number.isFinite(Number(S.cfg.temp)))S.cfg.temp=DEF.temp;
const save=()=>{try{localStorage.setItem("jomo",JSON.stringify(S))}catch(e){console.warn("Could not save local data",e)}};
const cfg=()=>S.cfg,cur=()=>S.convs.find(c=>c.id===S.cur);
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeHttp=u=>{try{const x=new URL(u);return ["http:","https:"].includes(x.protocol)?x.href:"#"}catch{return "#"}};
function inline(s){return esc(s).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(_,label,url)=>`<a href="${esc(safeHttp(url))}" target="_blank" rel="noopener noreferrer">${label}</a>`)}
function md(text){
 const blocks=String(text??"").split(/```/);return blocks.map((part,i)=>{
  if(i%2){let lang="code",code=part;const match=part.match(/^([\w+-]*)\n/);if(match){lang=match[1]||"code";code=part.slice(match[0].length)}return `<div class="cb"><div class="ch"><span>${esc(lang)}</span><button type="button" class="cc">Copy</button></div><pre><code>${esc(code)}</code></pre></div>`}
  let out="",list=null;for(const line of part.split("\n")){const li=line.match(/^\s*((?:[-*])|(?:\d+\.))\s+(.*)$/);if(li){const type=/^\d/.test(li[1])?"ol":"ul";if(list!==type){if(list)out+=`</${list}>`;out+=`<${type}>`;list=type}out+=`<li>${inline(li[2])}</li>`;continue}if(list){out+=`</${list}>`;list=null}const h=line.match(/^(#{1,3})\s+(.*)$/);if(h)out+=`<h${h[1].length+2}>${inline(h[2])}</h${h[1].length+2}>`;else if(line.startsWith("> "))out+=`<blockquote>${inline(line.slice(2))}</blockquote>`;else if(line.trim())out+=`${inline(line)}<br>`}if(list)out+=`</${list}>`;return out;
 }).join("");
}
let ctrl=null,busy=false,files=[],imgMode=false,rec=null,vm=false,vrec=null,vmute=false,vsp=false,voiceRestart=null,voiceFinal="";
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setSessionCollapsed(value){$("sessionSec").classList.toggle("collapsed",!!value);$("sessionToggle").setAttribute("aria-expanded",String(!value));cfg().sessionCollapsed=!!value;save()}

function newConv(){const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),title:"New conversation",msgs:[]};S.convs.unshift(c);S.cur=c.id;save();draw();$("in").focus()}

function copyText(text,btn){const done=()=>{if(btn){btn.innerHTML=ic("check")+"<span>Copied</span>";setTimeout(()=>btn.innerHTML=ic("copy")+"<span>Copy</span>",1300)}};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(String(text)).then(done).catch(()=>legacyCopy(text,done));else legacyCopy(text,done)}

 if(m.role==="user"){const wrap=document.createElement("div");wrap.style.cssText="display:flex;flex-direction:column;align-items:flex-end;max-width:85%";const b=document.createElement("div");b.className="b";b.dir="auto";b.style.maxWidth="100%";b.innerHTML=esc(m.content).replace(/\n/g,"<br>");const act=document.createElement("div");act.className="act";const edit=document.createElement("button");edit.innerHTML=ic("edit")+"Edit";edit.onclick=()=>{if(busy)return;const c=cur();$("in").value=m.content;c.msgs=c.msgs.slice(0,index);save();draw();$("in").focus();resizeInput()};act.append(edit);wrap.append(b,act);d.append(wrap);return d}
 const av=document.createElement("div");av.className="av";av.innerHTML=ic("logo");const wrap=document.createElement("div");wrap.style.cssText="min-width:0;flex:1";const body=document.createElement("div");body.className="b";body.dir="auto";body.innerHTML=m.img?imageHTML(m):m.error?`<span class="err">${esc(m.content)}</span>`:md(m.content);const act=document.createElement("div");act.className="act";
 const add=(name,label,fn)=>{const b=document.createElement("button");b.type="button";b.dataset.a=name;b.innerHTML=ic(name==="copy"?"copy":name==="regen"?"regen":name==="up"?"up":name==="down"?"down":"spk")+(label?`<span>${label}</span>`:"");b.onclick=fn;act.append(b);return b};
 add("copy","Copy",e=>copyText(m.img||m.content,e.currentTarget));

 wrap.append(body,act);d.append(av,wrap);
 const img=body.querySelector(".gen img"),box=body.querySelector(".gen");if(img&&box){img.onload=()=>box.classList.add("ok");img.onerror=()=>box.classList.add("bad");if(img.complete){if(img.naturalWidth)box.classList.add("ok");else box.classList.add("bad")}}

const suggestions=["Explain a concept simply","Write or debug code","/image a futuristic neon city at night, cinematic","Brainstorm ideas with me"];
function draw(){drawList();const c=cur();if(!c)return;$("w").replaceChildren();if(!c.msgs.length){const e=document.createElement("div");e.className="empty";e.innerHTML=`<div class="lg">${ic("logo")}</div><div style="font-size:18px;color:var(--txt)">How can I help you today?</div><div class="sgs">${suggestions.map((s,i)=>`<button class="sg" type="button" data-i="${i}">${esc(s)}</button>`).join("")}</div>`;e.querySelectorAll(".sg").forEach(b=>b.onclick=()=>{$("in").value=b.textContent;if(b.textContent.startsWith("/image ")){$("in").value=b.textContent.slice(7);imgMode=true}send()});$("w").append(e)}else c.msgs.forEach((m,i)=>$("w").append(msgEl(m,i,i===c.msgs.length-1)));$("mode").value=cfg().mode;$("mn").textContent=(cfg()[cfg().mode]||"auto").trim()||"auto";$("sp").value=cfg().sys;$("tp").value=cfg().temp;$("tv").textContent=cfg().temp;const chars=c.msgs.reduce((n,m)=>n+String(m.content||"").length,0);$("info").textContent=`${c.msgs.length} messages · ~${Math.ceil(chars/4)} tokens`;$("sd").innerHTML=ic(busy?"stop":"send");$("sd").title=busy?"Stop":"Send";scrollBottom()}
function scrollBottom(){$("msgs").scrollTop=$("msgs").scrollHeight}
function resizeInput(){const el=$("in");el.style.height="auto";el.style.height=Math.min(el.scrollHeight,180)+"px"}
function extractText(data,raw){if(typeof data==="string"&&data.trim())return data.trim();const c=data?.choices?.[0]?.message?.content??data?.choices?.[0]?.text??data?.reply??data?.response??data?.output??data?.answer??data?.text??data?.content??(typeof data?.message==="string"?data.message:"");if(typeof c==="string"&&c.trim())return c.trim();if(Array.isArray(c))return c.map(x=>x.text||"").join("").trim();if(typeof raw==="string"&&raw.includes("data:")){let out="";for(const line of raw.split(/\r?\n/)){if(!line.startsWith("data:")||line.includes("[DONE]"))continue;try{const x=JSON.parse(line.slice(5).trim());out+=x?.choices?.[0]?.delta?.content||x?.choices?.[0]?.text||""}catch{}}if(out.trim())return out.trim()}return ""}
  async function postChat(messages,signal){
 const model=cfg()[cfg().mode]||"";
 const payload={
  messages,
  model:model||undefined,
  temperature:Number(cfg().temp),
  system:cfg().sys,
  stream:false
 };
 let primaryError=null;

 // Primary: Supabase Edge Function
 try{
  const response=await fetch(PRIMARY_ENDPOINT,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":PRIMARY_KEY,
    "Authorization":"Bearer "+PRIMARY_KEY
   },
   body:JSON.stringify(payload),
   signal
  });

  const raw=await response.text();
  if(!response.ok)throw new Error(`Supabase HTTP ${response.status}: ${raw.slice(0,400)}`);

  let data;
  try{data=JSON.parse(raw)}catch{data=raw}
  const answer=extractText(data,raw);
  if(!answer)throw new Error("Supabase returned an empty response.");
  return {text:answer,provider:"Supabase"};
 }catch(e){
  if(e.name==="AbortError")throw e;
  primaryError=e;
  console.warn("Supabase request failed:",e);
 }

 // Fallback: Pollinations
 try{
  const fallbackMessages=[
   {role:"system",content:cfg().sys},
   ...messages.map(m=>({role:m.role,content:m.content}))
  ];
  const response=await fetch(FALLBACK_ENDPOINT,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    model:"openai",
    messages:fallbackMessages,
    temperature:Number(cfg().temp)
   }),
   signal
  });

  const raw=await response.text();
  if(!response.ok)throw new Error(`Fallback HTTP ${response.status}: ${raw.slice(0,300)}`);

  let data;
  try{data=JSON.parse(raw)}catch{data=raw}
  const answer=extractText(data,raw);
  if(!answer)throw new Error("Fallback returned an empty response.");
  return {text:answer,provider:"Pollinations"};
 }catch(e){
  if(e.name==="AbortError")throw e;
  throw new Error(
   "Both AI providers failed.\n"+
   "Supabase: "+(primaryError?.message||"Unknown error")+"\n"+
   "Fallback: "+e.message
  );
 }
}

async function generateImage(prompt,signal){
 const encoded=encodeURIComponent(prompt);
 const seed=Math.floor(Math.random()*999999999);
 const url=`https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&seed=${seed}&nologo=true`;
 const response=await fetch(url,{method:"GET",signal});
 if(!response.ok)throw new Error("Image provider returned HTTP "+response.status);
 const blob=await response.blob();
 if(!blob.type.startsWith("image/"))throw new Error("Invalid image response.");
 return URL.createObjectURL(blob);
}

function messagesForAPI(c){
 return c.msgs
  .filter(m=>!m.error&&!m.img&&["user","assistant"].includes(m.role))
  .map(m=>({role:m.role,content:m.content}));
}

async function send(){
 if(busy){stop();return}
 const c=cur();
 if(!c)return;

 const text=$("in").value.trim();
 if(!text&&!files.length&&!imgMode)return;

 if(imgMode){
  const prompt=text||"A beautiful abstract digital artwork";
  $("in").value="";
  resizeInput();
  imgMode=false;
  await sendImage(prompt);
  return;
 }

 const attached=files.map(f=>f.text?`\n\n[Attached file: ${f.name}]\n${f.text}`:`\n\n[Attached file: ${f.name}]`);
 const content=text+attached.join("");
 if(!content.trim())return;

 c.msgs.push({role:"user",content});
 if(c.title==="New conversation"){
  c.title=text.slice(0,45)||"Attached file";
 }
 files=[];
 $("fl").style.display="none";
 $("fl").textContent="";
 $("in").value="";
 resizeInput();
 save();
 draw();
 await requestAnswer();
}

async function sendImage(prompt){
 const c=cur();
 if(!c)return;

 c.msgs.push({role:"user",content:"/image "+prompt});
 const item={role:"assistant",content:"",img:"",prompt};
 c.msgs.push(item);
 save();
 draw();

 busy=true;
 ctrl=new AbortController();
 $("sd").innerHTML=ic("stop");

 try{
  const url=await generateImage(prompt,ctrl.signal);
  item.img=url;
  item.content="Image generated successfully.";
 }catch(e){
  if(e.name==="AbortError"){
   item.content="Image generation cancelled.";
   item.error=true;
  }else{
   item.content="Image generation failed: "+e.message;
   item.error=true;
  }
 }finally{
  busy=false;
  ctrl=null;
  save();
  draw();
 }
}

async function requestAnswer(){
 const c=cur();
 if(!c||busy)return;

 busy=true;
 ctrl=new AbortController();

 const placeholder={role:"assistant",content:""};
 c.msgs.push(placeholder);
 save();
 draw();

 try{
  const history=messagesForAPI(c).slice(0,-1);
  const result=await postChat(history,ctrl.signal);
  placeholder.content=result.text;
  placeholder.provider=result.provider;
 }catch(e){
  if(e.name==="AbortError"){
   placeholder.content="Generation stopped.";
   placeholder.error=true;
  }else{
   placeholder.content=e.message;
   placeholder.error=true;
  }
 }finally{
  busy=false;
  ctrl=null;
  save();
  draw();
 }
}

function stop(){
 if(ctrl){
  ctrl.abort();
  ctrl=null;
 }
 busy=false;
 draw();
}

async function regenerate(index){
 const c=cur();
 if(!c||busy)return;

 let target=index;
 if(c.msgs[target]?.role!=="assistant")return;

 c.msgs.splice(target,1);
 save();
 draw();
 await requestAnswer();
}

function addFile(file){
 const allowed=1000000;
 if(file.size>allowed){
  alert("File is too large. Maximum size is 1 MB.");
  return;
 }

 const reader=new FileReader();

 reader.onload=()=>{
  files.push({
   name:file.name,
   text:String(reader.result||"").slice(0,30000)
  });
  updateFiles();
 };

 reader.onerror=()=>alert("Could not read this file.");
 reader.readAsText(file);
}

function updateFiles(){
 if(!files.length){
  $("fl").style.display="none";
  return;
 }
 $("fl").style.display="inline-flex";
 $("fl").innerHTML="";
 const label=document.createElement("span");
 label.textContent=files.length+" file(s) attached";
 const remove=document.createElement("button");
 remove.type="button";
 remove.textContent="×";
 remove.title="Remove attachments";
 remove.onclick=()=>{
  files=[];
  updateFiles();
 };
 $("fl").append(label,remove);
}

function exportChat(){
 const c=cur();
 if(!c||!c.msgs.length){
  alert("There is no conversation to export.");
  return;
 }

 const content=[
  "# "+(c.title||"JOMO AI Conversation"),
  "",
  ...c.msgs.map(m=>{
   const role=m.role==="user"?"You":"JOMO AI";
   return `## ${role}\n\n${m.img?m.prompt:m.content}`;
  })
 ].join("\n\n");

 const blob=new Blob([content],{type:"text/markdown;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=(c.title||"jomo-chat").replace(/[\\/:*?"<>|]/g,"-")+".md";
 document.body.append(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function speak(text){
 if(!("speechSynthesis" in window)){
  alert("Speech synthesis is not supported by this browser.");
  return;
 }

 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(
  String(text).slice(0,5000)
 );
 utterance.lang=cfg().vl||"en-US";
 utterance.rate=1;
 speechSynthesis.speak(utterance);
}

function dictate(){
 if(!SR){
  alert("Speech recognition is not supported. Try Chrome or Edge.");
  return;
 }

 if(rec){
  rec.stop();
  rec=null;
  return;
 }

 rec=new SR();
 rec.lang=cfg().vl||"en-US";
 rec.interimResults=true;
 rec.continuous=false;

 rec.onresult=e=>{
  let result="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   result+=e.results[i][0].transcript;
  }
  $("in").value=result;
  resizeInput();
 };

 rec.onerror=e=>{
  console.warn("Speech recognition:",e.error);
  if(e.error!=="no-speech"&&e.error!=="aborted"){
   alert("Microphone error: "+e.error);
  }
  rec=null;
 };

 rec.onend=()=>{rec=null};
 try{rec.start()}catch(e){rec=null;alert(e.message)}
}

function startVoice(){
 if(!SR){
  alert("Live voice requires a browser supporting Speech Recognition. Use Chrome or Edge.");
  return;
 }

 if(!window.speechSynthesis){
  alert("Speech synthesis is unavailable in this browser.");
  return;
 }

 vm=true;
 vmute=false;
 $("vm").classList.add("on");
 $("vo").dataset.s="listen";
 $("vt").textContent="Listening... Speak now.";
 $("vmu").classList.remove("off");

 startVoiceRecognition();
}

function startVoiceRecognition(){
 if(!vm||vmute)return;

 if(vrec){
  try{vrec.stop()}catch{}
 }

 vrec=new SR();
 vrec.lang=$("vl").value||cfg().vl;
 vrec.interimResults=true;
 vrec.continuous=false;

 voiceFinal="";

 vrec.onresult=e=>{
  let interim="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   const r=e.results[i];
   if(r.isFinal)voiceFinal+=r[0].transcript+" ";
   else interim+=r[0].transcript;
  }
  $("vt").textContent=(voiceFinal+interim).trim()||"Listening...";
 };

 vrec.onerror=e=>{
  console.warn("Voice recognition error:",e.error);
  if(e.error==="not-allowed"){
   $("vt").textContent="Microphone permission denied.";
   endVoice();
  }
 };

 vrec.onend=()=>{
  if(!vm)return;

  const spoken=voiceFinal.trim();
  if(spoken){
   voiceFinal="";
   handleVoiceText(spoken);
  }else if(!vmute){
   voiceRestart=setTimeout(startVoiceRecognition,350);
  }
 };

 try{vrec.start()}catch(e){
  console.warn(e);
 }
}

async function handleVoiceText(text){
 if(!vm)return;

 $("vo").dataset.s="think";
 $("vt").textContent=text;

 const c=cur()||createVoiceConversation();
 c.msgs.push({role:"user",content:text});
 c.title=c.title==="New conversation"?text.slice(0,45):c.title;

 busy=true;
 ctrl=new AbortController();

 const placeholder={role:"assistant",content:""};
 c.msgs.push(placeholder);
 save();
 draw();

 try{
  const result=await postChat(messagesForAPI(c).slice(0,-1),ctrl.signal);
  placeholder.content=result.text;
  placeholder.provider=result.provider;
  $("vo").dataset.s="speak";
  $("vt").textContent=result.text.slice(0,500);
  speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(result.text.slice(0,4000));
  utterance.lang=$("vl").value||cfg().vl;
  utterance.onend=()=>{
   if(vm){
    $("vo").dataset.s="listen";
    $("vt").textContent="Listening...";
    voiceRestart=setTimeout(startVoiceRecognition,400);
   }
  };
  speechSynthesis.speak(utterance);

 }catch(e){
  placeholder.content=e.message;
  placeholder.error=true;
  $("vo").dataset.s="listen";
  $("vt").textContent="An error occurred. Try speaking again.";
  voiceRestart=setTimeout(startVoiceRecognition,1200);
 }finally{
  busy=false;
  ctrl=null;
  save();
  draw();
 }
}

function createVoiceConversation(){
 newConv();
 return cur();
}

function endVoice(){
 vm=false;
 clearTimeout(voiceRestart);
 voiceRestart=null;

 if(vrec){
  try{vrec.abort()}catch{}
  vrec=null;
 }

 speechSynthesis.cancel();
 $("vm").classList.remove("on");
 $("vo").dataset.s="idle";
}
