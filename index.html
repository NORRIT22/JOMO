<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOMO AI</title>
<style>
:root{--bg:#0B0B0C;--panel:#151517;--line:#26262a;--txt:#EAEAEA;--mut:#85858B;--acc:#5B4DFF;--r:10px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--mut);padding:6px 8px;border-radius:8px}
button:hover{color:var(--txt);background:#1d1d20}
.app{display:grid;grid-template-columns:250px 1fr 270px;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;min-height:0}
aside.r{border-right:0;border-left:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;letter-spacing:.5px;padding:4px 4px 8px}
.brand svg{width:26px;height:26px}
.new{background:#1f1f23;border:1px solid var(--line);color:var(--txt);justify-content:flex-start;padding:9px 12px}
.new:hover{border-color:var(--acc)}
.field{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:0}
.field:focus{border-color:var(--acc)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--mut);cursor:pointer;gap:6px}
.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it:hover,.it.on{background:#1f1f23;color:var(--txt)}
.it button{padding:2px;opacity:0}.it:hover button{opacity:1}
.me{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);position:relative}
header .tg{position:absolute;left:12px}
select.field{width:auto;background:var(--panel)}
#msgs{flex:1;overflow:auto;padding:24px 16px}
.w{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.m{display:flex;gap:12px}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:none;color:#fff}
.av svg{width:16px;height:16px}
.m.u{justify-content:flex-end}
.m.u .b{background:#1f1f23;border:1px solid var(--line);padding:9px 14px;border-radius:14px;max-width:85%}
.b{min-width:0;overflow-wrap:anywhere}
.b pre{background:#0f0f18;border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:auto;margin:8px 0;direction:ltr;text-align:left}
.b code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.b :not(pre)>code{background:#1f1f23;padding:1px 5px;border-radius:5px}
.act{display:flex;gap:2px;margin-top:6px}
.act button{padding:4px 6px;font-size:12px}
.err{color:#ff7a7a}
.empty{margin:18vh auto 0;text-align:center;color:var(--mut)}
.empty svg{width:56px;height:56px;color:var(--txt);margin-bottom:12px}
.comp{max-width:760px;width:calc(100% - 32px);margin:0 auto 16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.comp:focus-within{border-color:var(--acc)}
textarea{width:100%;background:none;border:0;outline:0;resize:none;max-height:180px;padding:4px}
.bar{display:flex;align-items:center;gap:4px}
.send{background:var(--acc);color:#fff;border-radius:50%;width:34px;height:34px;justify-content:center;padding:0;margin-left:auto}
.send:hover{background:#6e62ff;color:#fff}
.chip{background:#1f1f23;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--mut)}
.sec{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.sec h4{font-weight:500;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(480px,92vw);margin:auto}
dialog::backdrop{background:#000a}
dialog label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pri{background:var(--acc);color:#fff}.pri:hover{background:#6e62ff;color:#fff}
@media(max-width:1000px){.app{grid-template-columns:250px 1fr}aside.r{display:none}}
@media(max-width:700px){.app{grid-template-columns:1fr}#sb{position:fixed;inset:0 25% 0 0;z-index:5;display:none}#sb.open{display:flex}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="logo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></g><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1-2.1"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/></symbol>
<symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
<symbol id="regen" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8c2 0 3 1 3 3v3h5a2 2 0 0 1 2 2l-1 6a2 2 0 0 1-2 2H7"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="M7 13V4H4v9zM7 13l4 8c2 0 3-1 3-3v-3h5a2 2 0 0 0 2-2l-1-6a2 2 0 0 0-2-2H7"/></symbol>
<symbol id="clip" viewBox="0 0 24 24"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.500 8.500a2 2 0 0 1-3-3L14 7"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="bin" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
<symbol id="panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="dl" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
</defs></svg>

<div class="app">
<aside id="sb">
  <div class="brand"><svg class="i"><use href="#logo"/></svg>JOMO AI</div>
  <button class="new" id="nw"><svg class="i"><use href="#plus"/></svg>New Conversation</button>
  <input class="field" id="q" placeholder="Search conversations">
  <div id="list"></div>
  <div class="me">
    <button id="exp"><svg class="i"><use href="#dl"/></svg>Export chat</button>
    <button id="st"><svg class="i"><use href="#gear"/></svg>Settings</button>
    <div style="display:flex;gap:8px;align-items:center;padding:6px 8px;color:var(--mut)"><svg class="i"><use href="#user"/></svg>User Profile</div>
  </div>
</aside>

<main>
  <header>
    <button class="tg" id="tg" title="Sidebar"><svg class="i"><use href="#panel"/></svg></button>
    <select class="field" id="mode"><option value="fast">Fast Mode</option><option value="think">Thinking Mode</option></select>
    <span class="chip" id="mn"></span>
  </header>
  <div id="msgs"><div class="w" id="w"></div></div>
  <div class="comp">
    <textarea id="in" rows="1" placeholder="Ask JOMO anything..." dir="auto"></textarea>
    <div class="bar">
      <button id="at"><svg class="i"><use href="#clip"/></svg>Attach File</button>
      <button id="vc"><svg class="i"><use href="#mic"/></svg>Voice Input</button>
      <span id="fl" class="chip" style="display:none"></span>
      <button class="send" id="sd"><svg class="i"><use href="#send"/></svg></button>
    </div>
    <input type="file" id="fi" hidden accept=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.log">
  </div>
</main>

<aside class="r">
  <div class="sec"><h4>Current Session</h4><div id="info" style="color:var(--mut)"></div></div>
  <div class="sec"><h4>System Prompt</h4><textarea class="field" id="sp" rows="6" dir="auto" style="resize:vertical"></textarea></div>
  <div class="sec"><h4>Temperature <span id="tv" style="float:right;color:var(--txt)"></span></h4><input type="range" id="tp" min="0" max="1.5" step="0.1" style="accent-color:var(--acc)"></div>
</aside>
</div>

<dialog id="dg">
  <h3 style="font-weight:500">Settings: API and Connections</h3><p style="color:var(--mut);margin:8px 0 12px">JOMO is connected to GPT-6 Luna through its Supabase server function. The provider, Base URL and API Key fields below do not control this connection.</p>
  <label>Provider</label>
  <select class="field" id="pv"><option value="openai">OpenAI-compatible (OpenAI, OpenRouter, Groq, DeepSeek, Ollama...)</option><option value="anthropic">Anthropic (Claude)</option></select>
  <label>Base URL</label><input class="field" id="bu" dir="ltr">
  <label>API Key</label><input class="field" id="ak" type="password" dir="ltr" placeholder="Not used: connection is handled securely by Supabase">
  <label>Fast model</label><input class="field" id="m1" dir="ltr">
  <label>Thinking model</label><input class="field" id="m2" dir="ltr">
  <div class="row"><button id="cl">Cancel</button><button class="pri" id="sv">Save</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const DEF={provider:'openai',base:'https://api.openai.com/v1',key:'',fast:'gpt-4o-mini',think:'gpt-4o',sys:'You are JOMO, a precise, concise and helpful AI assistant. Answer in the language of the user.',temp:0.7,mode:'fast'};
let S;
try{S=JSON.parse(localStorage.getItem('jomo')||'null')}catch(e){}
S=S||{convs:[],cur:null,cfg:{}};
S.cfg={...DEF,...S.cfg};
const save=()=>{try{localStorage.setItem('jomo',JSON.stringify(S))}catch(e){}};
const cfg=()=>S.cfg;
const cur=()=>S.convs.find(c=>c.id===S.cur);
let ctrl=null,files=[],busy=false;

const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=t=>t.split('```').map((p,i)=>i%2?'<pre><code>'+esc(p.replace(/^[\w+-]*\n/,''))+'</code></pre>':esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')).join('');

function newConv(){const c={id:Date.now().toString(36),title:'New conversation',msgs:[]};S.convs.unshift(c);S.cur=c.id;save();draw();$('in').focus()}

function drawList(){
  const q=$('q').value.toLowerCase();
  $('list').innerHTML='';
  S.convs.filter(c=>c.title.toLowerCase().includes(q)).forEach(c=>{
    const d=document.createElement('div');d.className='it'+(c.id===S.cur?' on':'');
    d.innerHTML=`<span dir="auto">${esc(c.title)}</span><button title="Delete">${ic('bin')}</button>`;
    d.onclick=()=>{S.cur=c.id;save();draw();$('sb').classList.remove('open')};
    d.querySelector('button').onclick=e=>{e.stopPropagation();S.convs=S.convs.filter(x=>x!==c);if(S.cur===c.id)S.cur=S.convs[0]?.id||null;save();if(!S.cur)newConv();else draw()};
    $('list').append(d);
  });
}

function msgEl(m,i,last){
  const d=document.createElement('div');d.className='m '+(m.role==='user'?'u':'a');
  if(m.role==='user'){d.innerHTML=`<div class="b" dir="auto">${esc(m.content).replace(/\n/g,'<br>')}</div>`;return d}
  d.innerHTML=`<div class="av"><svg class="i"><use href="#logo"/></svg></div><div style="min-width:0;flex:1"><div class="b" dir="auto">${m.error?'<span class="err">'+esc(m.content)+'</span>':md(m.content)}</div><div class="act">
  <button data-a="copy">${ic('copy')}Copy</button>${last?`<button data-a="regen">${ic('regen')}Regenerate</button>`:''}
  <button data-a="up" style="${m.fb==='up'?'color:var(--acc)':''}">${ic('up')}</button><button data-a="down" style="${m.fb==='down'?'color:var(--acc)':''}">${ic('down')}</button></div></div>`;
  d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='copy')navigator.clipboard.writeText(m.content);
    if(a==='regen'){cur().msgs.pop();save();draw();run()}
    if(a==='up'||a==='down'){m.fb=m.fb===a?'':a;save();draw()}
  });
  return d;
}

function draw(){
  drawList();
  const c=cur();const w=$('w');w.innerHTML='';
  if(!c.msgs.length)w.innerHTML=`<div class="empty"><svg class="i"><use href="#logo"/></svg><div style="font-size:18px;color:var(--txt)">How can I help you today?</div></div>`;
  c.msgs.forEach((m,i)=>w.append(msgEl(m,i,i===c.msgs.length-1)));
  $('mode').value=cfg().mode;$('mn').textContent=cfg()[cfg().mode];
  $('sp').value=cfg().sys;$('tp').value=cfg().temp;$('tv').textContent=cfg().temp;
  $('info').textContent=c.msgs.length+' messages - ~'+Math.round(c.msgs.reduce((n,m)=>n+m.content.length,0)/4)+' tokens';
  $('sd').innerHTML=ic(busy?'stop':'send');
  $('msgs').scrollTop=$('msgs').scrollHeight;
}

async function run(){
  const c=cur(),g=cfg();
  busy=true;draw();
  const m={role:'assistant',content:''};c.msgs.push(m);
  const el=msgEl(m,0,false);$('w').append(el);const bd=el.querySelector('.b');
  ctrl=new AbortController();
  const hist=c.msgs.slice(0,-1).map(x=>({role:x.role,content:x.content}));
  const messages=[{role:'system',content:g.sys},...hist];
  try{
    const endpoint="https://ervctvcghmyurnqlyqwm.supabase.co/functions/v1/coarena-chat";
    const r=await fetch(endpoint,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':"sb_publishable_FGJPNZUejNt9gC2h2si6-Q_NG06feiy"
      },
      body:JSON.stringify({model:'gpt-6-luna',messages}),
      signal:ctrl.signal
    });
    const raw=await r.text();
    let data;
    try{data=JSON.parse(raw)}catch(e){throw new Error('Supabase returned an unreadable response: '+raw.slice(0,300))}
    if(!r.ok){
      const detail=data?.error?.message||data?.message||data?.error||raw;
      throw new Error(r.status+': '+detail);
    }
    if(data?.error)throw new Error(data.error.message||JSON.stringify(data.error));
    const answer=data?.choices?.[0]?.message?.content;
    if(typeof answer!=='string'||!answer.trim())throw new Error('The model returned no text. Check the Edge Function response.');
    m.content=answer;
    bd.innerHTML=md(m.content);$('msgs').scrollTop=$('msgs').scrollHeight;
  }catch(e){
    if(e.name==='AbortError'){m.content=m.content||'(stopped)'}
    else{m.error=true;m.content='Error: '+e.message}
  }
  busy=false;ctrl=null;save();draw();
}
function send(){
  if(busy){ctrl?.abort();return}
  const c=cur();let t=$('in').value.trim();
  if(!t&&!files.length)return;
  files.forEach(f=>t+=`\n\n[File: ${f.name}]\n${f.text}`);
  files=[];$('fl').style.display='none';
  c.msgs.push({role:'user',content:t.trim()});
  if(c.msgs.length===1)c.title=t.trim().slice(0,40);
  $('in').value='';$('in').style.height='auto';save();draw();run();
}

$('sd').onclick=send;
$('in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('in').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
$('nw').onclick=newConv;$('q').oninput=drawList;
$('tg').onclick=()=>$('sb').classList.toggle('open');
$('mode').onchange=e=>{cfg().mode=e.target.value;save();draw()};
$('sp').onchange=e=>{cfg().sys=e.target.value;save()};
$('tp').oninput=e=>{cfg().temp=+e.target.value;$('tv').textContent=cfg().temp;save()};
$('at').onclick=()=>$('fi').click();
$('fi').onchange=async e=>{
  for(const f of e.target.files)files.push({name:f.name,text:(await f.text()).slice(0,60000)});
  e.target.value='';$('fl').textContent=files.map(f=>f.name).join(', ');$('fl').style.display=files.length?'':'none';
};
$('exp').onclick=()=>{
  const c=cur();const t=c.msgs.map(m=>(m.role==='user'?'## You\n':'## JOMO\n')+m.content).join('\n\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'}));a.download='jomo-chat.md';a.click();
};
let rec=null;
$('vc').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return alert('Voice input is not supported in this browser.');
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=navigator.language||'ar';rec.interimResults=false;
  rec.onresult=e=>{$('in').value+=(($('in').value?' ':'')+e.results[0][0].transcript)};
  rec.onend=()=>{rec=null;$('vc').style.color=''};rec.start();$('vc').style.color='var(--acc)';
};
const P={openai:'https://api.openai.com/v1',anthropic:'https://api.anthropic.com/v1'};
$('pv').onchange=e=>{$('bu').value=P[e.target.value];$('m1').value=e.target.value==='anthropic'?'claude-haiku-4-5':'gpt-4o-mini';$('m2').value=e.target.value==='anthropic'?'claude-sonnet-4-5':'gpt-4o'};
$('st').onclick=()=>{const g=cfg();$('pv').value=g.provider;$('bu').value=g.base;$('ak').value=g.key;$('m1').value=g.fast;$('m2').value=g.think;$('dg').showModal()};
$('cl').onclick=()=>$('dg').close();
$('sv').onclick=()=>{Object.assign(cfg(),{provider:$('pv').value,base:$('bu').value.trim(),key:$('ak').value.trim(),fast:$('m1').value.trim(),think:$('m2').value.trim()});save();$('dg').close();draw()};

if(!S.convs.length)newConv();else{if(!cur())S.cur=S.convs[0].id;draw()}
</script>
</body>
</html>
